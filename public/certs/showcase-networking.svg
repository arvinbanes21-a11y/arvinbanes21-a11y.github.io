<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- links -->
  <g stroke="#a9c4dc" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="256" x2="96" y2="110"/>
    <line x1="256" y1="256" x2="416" y2="110"/>
    <line x1="256" y1="256" x2="96" y2="402"/>
    <line x1="256" y1="256" x2="416" y2="402"/>
  </g>
  <!-- outer nodes: shadow then face -->
  <g fill="#463b4b">
    <circle cx="106" cy="120" r="54"/><circle cx="426" cy="120" r="54"/>
    <circle cx="106" cy="412" r="54"/><circle cx="426" cy="412" r="54"/>
  </g>
  <g>
    <circle cx="96" cy="110" r="54" fill="#575d70"/>
    <circle cx="416" cy="110" r="54" fill="#575d70"/>
    <circle cx="96" cy="402" r="54" fill="#575d70"/>
    <circle cx="416" cy="402" r="54" fill="#575d70"/>
    <circle cx="96" cy="110" r="32" fill="#d9e6f2"/>
    <circle cx="416" cy="110" r="32" fill="#d9e6f2"/>
    <circle cx="96" cy="402" r="32" fill="#d9e6f2"/>
    <circle cx="416" cy="402" r="32" fill="#d9e6f2"/>
    <circle cx="96" cy="110" r="14" fill="#5ad6ff"/>
    <circle cx="416" cy="110" r="14" fill="#5ad6ff"/>
    <circle cx="96" cy="402" r="14" fill="#fba01a"/>
    <circle cx="416" cy="402" r="14" fill="#fba01a"/>
  </g>
  <!-- central router -->
  <rect x="166" y="206" width="190" height="110" rx="26" fill="#463b4b"/>
  <rect x="156" y="196" width="190" height="110" rx="26" fill="#575d70"/>
  <rect x="172" y="212" width="158" height="78" rx="16" fill="#d9e6f2"/>
  <g fill="#23a8e8"><circle cx="205" cy="251" r="12"/><circle cx="251" cy="251" r="12"/></g>
  <circle cx="297" cy="251" r="12" fill="#fba01a"/>
  <!-- antennas -->
  <g stroke="#575d70" stroke-width="12" stroke-linecap="round">
    <line x1="190" y1="196" x2="170" y2="150"/>
    <line x1="312" y1="196" x2="332" y2="150"/>
  </g>
  <g fill="#f06a22"><circle cx="169" cy="146" r="10"/><circle cx="333" cy="146" r="10"/></g>
</svg>
